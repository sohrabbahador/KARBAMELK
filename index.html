
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Loading</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#101827;
font-family:Arial,sans-serif
}
.loading{text-align:center}
h1{
color:#fff;
font-size:32px;
letter-spacing:5px;
font-weight:700
}
p{
color:#8DA6C5;
font-size:12px;
margin-top:12px;
letter-spacing:1px
}
.dots{
display:flex;
justify-content:center;
gap:7px;
margin-top:25px
}
.dots span{
width:6px;
height:6px;
background:#75B9F5;
border-radius:50%;
animation:pulse 1.2s infinite ease-in-out
}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes pulse{
0%,60%,100%{opacity:.3;transform:translateY(0)}
30%{opacity:1;transform:translateY(-7px)}
}
</style>
</head>
<body>
<div class="loading">
<h1>LOADING</h1>
<p>Please wait...</p>
<div class="dots">
<span></span><span></span><span></span>
</div>
</div>
</body>
</html>
